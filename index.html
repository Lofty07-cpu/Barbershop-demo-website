<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="">
  <meta name="description" content="">
  <title></title>
  <link rel="icon" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="business-fonts" rel="stylesheet" href="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name"></span>
    </a>
    <nav class="main-nav" aria-label="">
      <a href="#services" data-nav="services"></a>
      <a href="#about" data-nav="about"></a>
      <a href="#reviews" data-nav="reviews"></a>
      <a href="#visit" data-nav="visit"></a>
    </nav>
    <a class="button button-small" href="#book"><span data-copy="navigation.booking"></span><span aria-hidden="true">↗</span></a>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-image" role="img"></div>
      <div class="hero-shade"></div>
      <div class="hero-content">
        <p class="eyebrow"><span></span><span data-copy="hero.eyebrow"></span></p>
        <h1><span data-copy="hero.heading"></span><br><em data-copy="hero.headingAccent"></em></h1>
        <p class="hero-copy" data-copy="hero.description"></p>
        <div class="hero-actions">
          <a class="button" href="#book"><span data-copy="hero.primaryAction"></span><span aria-hidden="true">↗</span></a>
          <a class="text-link" href="#services"><span data-copy="hero.secondaryAction"></span><span aria-hidden="true">↓</span></a>
        </div>
      </div>
      <div class="hero-note"><span class="note-line"></span><span data-copy="hero.note"></span></div>
      <div class="hero-index"><span data-copy="hero.index"></span> <span>/</span> <span data-copy="hero.total"></span></div>
    </section>

    <section class="intro-strip" aria-label="">
      <p data-copy="highlights.message"></p>
      <div class="strip-stat"><strong><span data-copy="highlights.rating"></span><span>★</span></strong><small data-copy="highlights.ratingLabel"></small></div>
      <div class="strip-stat"><strong><span data-copy="highlights.experience"></span><span>+</span></strong><small data-copy="highlights.experienceLabel"></small></div>
    </section>

    <section class="services section-wrap" id="services">
      <div class="section-heading">
        <div>
          <p class="eyebrow"><span></span><span data-copy="services.eyebrow"></span></p>
          <h2><span data-copy="services.heading"></span><br><em data-copy="services.headingAccent"></em></h2>
        </div>
        <p class="section-intro" data-copy="services.intro"></p>
      </div>
      <div class="service-grid"></div>
      <p class="price-note" data-copy="services.note"></p>
    </section>

    <section class="story" id="about">
      <div class="story-photo" role="img"></div>
      <div class="story-copy">
        <p class="eyebrow"><span></span><span data-copy="about.eyebrow"></span></p>
        <h2><span data-copy="about.heading"></span><br><em data-copy="about.headingAccent"></em></h2>
        <p data-copy="about.description"></p>
        <a class="text-link" href="#visit"><span data-copy="about.action"></span><span aria-hidden="true">↗</span></a>
        <div class="story-signoff"><span data-copy="about.signoff"></span><span data-copy="about.signature"></span></div>
      </div>
    </section>

    <section class="reviews section-wrap" id="reviews">
      <div class="reviews-heading">
        <p class="eyebrow"><span></span><span data-copy="reviews.eyebrow"></span></p>
        <h2><span data-copy="reviews.heading"></span><br><em data-copy="reviews.headingAccent"></em></h2>
        <div class="rating"><span>★★★★★</span> <strong><span data-copy="reviews.rating"></span> / 5</strong><small data-copy="reviews.ratingLabel"></small></div>
      </div>
      <div class="review-list"></div>
    </section>

    <section class="booking" id="book">
      <div class="booking-inner">
        <div>
          <p class="eyebrow"><span></span><span data-copy="booking.eyebrow"></span></p>
          <h2><span data-copy="booking.heading"></span><br><em data-copy="booking.headingAccent"></em></h2>
          <p class="booking-copy" data-copy="booking.description"></p>
          <a class="button button-light booking-link" target="_blank" rel="noopener noreferrer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L.2 24l6.5-1.7a11.8 11.8 0 0 0 5.4 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6-3.5-8.3ZM12.1 21.6c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.9 1 1-3.8-.2-.4a9.7 9.7 0 1 1 8.2 4.7Zm5.3-7.3c-.3-.2-1.7-.9-2-.9-.3-.1-.5-.2-.7.2s-.8.9-1 1.1c-.2.2-.4.2-.7.1-.3-.2-1.2-.4-2.3-1.4-.9-.8-1.5-1.7-1.7-2-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.8s1.2 3.2 1.4 3.4c.2.2 2.4 3.7 5.8 5.1.8.3 1.4.5 1.9.6.8.2 1.5.2 2 .1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4s-.2-.3-.5-.4Z"/></svg>
            <span data-copy="booking.action"></span><span aria-hidden="true">↗</span>
          </a>
          <small class="booking-hint" data-copy="booking.hint"></small>
        </div>
        <div class="booking-details"></div>
      </div>
    </section>

    <section class="visit section-wrap" id="visit">
      <div>
        <p class="eyebrow"><span></span><span data-copy="contact.eyebrow"></span></p>
        <h2><span data-copy="contact.heading"></span><br><em data-copy="contact.headingAccent"></em></h2>
      </div>
      <div class="visit-info"></div>
      <p class="price-note" data-copy="contact.note"></p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="#home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name"></span>
    </a>
    <p data-copy="business.slogan"></p>
    <nav class="social-links" aria-label=""></nav>
    <small data-copy="footer.copyright"></small>
  </footer>

  <a class="whatsapp-float booking-link" target="_blank" rel="noopener noreferrer" aria-label="">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L.2 24l6.5-1.7a11.8 11.8 0 0 0 5.4 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6-3.5-8.3ZM12.1 21.6c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.9 1 1-3.8-.2-.4a9.7 9.7 0 1 1 8.2 4.7Zm5.3-7.3c-.3-.2-1.7-.9-2-.9-.3-.1-.5-.2-.7.2s-.8.9-1 1.1c-.2.2-.4.2-.7.1-.3-.2-1.2-.4-2.3-1.4-.9-.8-1.5-1.7-1.7-2-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.8s1.2 3.2 1.4 3.4c.2.2 2.4 3.7 5.8 5.1.8.3 1.4.5 1.9.6.8.2 1.5.2 2 .1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4s-.2-.3-.5-.4Z"/></svg>
    <span data-copy="booking.floatAction"></span>
  </a>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
